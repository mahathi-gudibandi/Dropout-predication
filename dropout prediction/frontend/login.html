<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login | DropoutGuard</title>
    <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<nav class="navbar">
    <div class="nav-brand">🎓 DropoutGuard</div>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="login.html">Login</a></li>
    </ul>
</nav>

<main class="auth-container">
    <div class="auth-card glass">

        <div class="auth-logo">
            <div class="logo-icon">🎓</div>
            <h2>DropoutGuard</h2>
            <p>Student Early Intervention System</p>
        </div>

        <div class="tab-group">
            <button class="tab active" onclick="showTab('login')">Sign In</button>
            <button class="tab" onclick="showTab('signup')">Sign Up</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="loginUsername" placeholder="Enter your username" required/>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password" required/>
            </div>
            <div id="loginError" class="error-msg"></div>
            <button type="submit" class="btn btn-primary full-width" style="margin-top:0.5rem">Sign In →</button>
        </form>

        <!-- Signup Form -->
        <form id="signupForm" style="display:none" onsubmit="handleSignup(event)">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="signupUsername" placeholder="Choose a username" required minlength="3"/>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="signupPassword" placeholder="Choose a password (min 6 chars)" required minlength="6"/>
            </div>
            <div id="signupError" class="error-msg"></div>
            <div id="signupSuccess" class="success-msg"></div>
            <button type="submit" class="btn btn-primary full-width" style="margin-top:0.5rem">Create Account →</button>
        </form>

    </div>
</main>

<script src="js/auth.js"></script>
<script>
    function showTab(tab) {
        document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
        document.getElementById('signupForm').style.display = tab === 'signup' ? 'block' : 'none';
        document.querySelectorAll('.tab').forEach((t, i) => {
            t.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'signup'));
        });
    }
</script>
</body>
</html>
